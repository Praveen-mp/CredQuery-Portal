[project]
name = "dbchat"
version = "0.1.0"
description = "Self-hosted, natural-language chat over your own databases. Bring your own DB credentials and LLM provider; your team asks questions, no dev support needed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.7",
    "sqlalchemy>=2.1.4",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.2.4",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.9",
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "streamlit[auth]>=1.65.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.2.3"]
mongo = ["pymongo>=4.18.3"]
dev = [
    "pytest>=8.0.0",
    "pypdf>=5.0.0",
    "pylint>=4.1.3",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbchat"]

[tool.pylint.main]
# Run pylint against the installed env so it can actually resolve imports:
#   uv run pylint src tests
init-hook = 'import sys; sys.path.insert(0, "src")'
# Gate on SCORE, not on "zero messages were printed" — pylint's own exit code
# is a bitmask of severities found, so even one expected/reviewed warning
# (see the broad-exception-caught catches at adapter/agent boundaries,
# documented in adapters/base.py) makes it return non-zero and fail CI for
# no real reason. This still prints every message; it just doesn't fail the
# build over ones we've already reviewed and accepted.
fail-under = 9.5

[tool.pylint.format]
max-line-length = 120

[tool.pylint.similarities]
# Default (4) flags things like a caller passing the same 6-8 keyword
# arguments a layered call chain (UI -> service -> repository -> storage)
# mechanically repeats at each boundary — that's not duplicated logic, it's
# inherent to explicit parameters. Raised so it still catches real duplicated
# behavior (it previously caught app/ being a near-complete duplicate of
# dbchat/ before app/ was deleted).
min-similarity-lines = 10

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # SQLAlchemy models and Settings classes are data containers by design.
    "too-few-public-methods",
    # A pytest test function taking a parameter named after the fixture it
    # requests (e.g. `def test_x(client): ...` using a `client` fixture) is
    # how fixture injection works, not an accidental shadow — pylint doesn't
    # understand the pytest fixture mechanism.
    "redefined-outer-name",
]

[tool.pylint.basic]
# Streamlit pages (ui/app_pages/*.py) are flat, sequential scripts by design
# (see CONTRIBUTING.md) — a module-scope variable there is ordinary control
# flow, not an exported constant, so don't force UPPER_CASE on it. Function,
# class, and variable naming checks (which DO matter — see CLAUDE.md) are
# untouched by this.
const-naming-style = "any"

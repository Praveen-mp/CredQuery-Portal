[project]
name = "dbchat"
version = "0.1.0"
description = "Self-hosted, natural-language chat over your own databases. Bring your own DB credentials and LLM provider; your team asks questions, no dev support needed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.7",
    "sqlalchemy>=2.1.4",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "cryptography>=43.0.0",
    "streamlit>=1.65.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.2.3"]
mongo = ["pymongo>=4.18.3"]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbchat"]

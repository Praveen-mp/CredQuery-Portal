name: Commit message lint

# The local git hook (.pre-commit-config.yaml) blocks a bad commit message
# before it's even created, but that only applies to contributors who ran
# `pre-commit install --hook-type commit-msg` — this is the backstop for
# everyone else (or anyone who used --no-verify). Checks the PR title since
# that's what becomes the merge commit message on GitHub's default
# "squash and merge."
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Tests

on:
  push:
    paths:
      - "dbchat/**"
  pull_request:
    paths:
      - "dbchat/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbchat
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        # No secrets needed here — every test that touches config/storage sets
        # its own throwaway APP_SECRET_KEY/METADATA_DB_PATH via monkeypatch
        # (see tests/test_saved_reports.py, tests/test_api.py), isolated to a
        # pytest tmp_path. Nothing here reads real credentials.
        run: uv run pytest -v

name: Pylint

on:
  push:
    paths:
      - "dbchat/**"
  pull_request:
    paths:
      - "dbchat/**"

jobs:
  pylint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbchat
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        # Installs the project's real dependencies (streamlit, sqlalchemy,
        # pandas, ...) plus pylint itself, so pylint can actually resolve
        # imports instead of flagging every third-party package as missing.
        run: uv sync --extra dev
      - name: Run pylint
        # Run from dbchat/ so [tool.pylint] in dbchat/pyproject.toml (line
        # length, docstring rules tuned to this project's conventions) is
        # picked up automatically.
        run: uv run pylint src tests
